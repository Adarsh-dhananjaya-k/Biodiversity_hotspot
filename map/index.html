<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Biodiversity Hotspots</title>
    <link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Biodiversity Hotspots</h1>
    </header>
    <section id="map"></section>
    <button id="hotspot-hint" class="callout" type="button">
      <span class="spinner" aria-hidden="true"></span>
      <span class="callout-text">Select any hotspot on the map to begin exploring.</span>
    </button>
    
    <script src="../node_modules/leaflet/dist/leaflet.js" defer></script>
    <script src="./hotspots.js" defer></script>
    <script src="./map.js" defer></script>
  </body>
</html>
